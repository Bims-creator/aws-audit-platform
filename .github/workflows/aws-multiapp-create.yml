name: AWS Multiapp Create

on:
  workflow_dispatch:
    inputs:
      app-name:
        description: "Name for the new auditor app (lowercase, hyphens, e.g. s3-auditor)"
        required: true
        type: string

jobs:
  scaffold:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      workflows: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute names
        id: vars
        run: |
          APP_NAME="${{ inputs.app-name }}"
          APP_MODULE=$(echo "$APP_NAME" | tr '"'"'-'"'"' '"'"'_'"'"')
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "app_module=$APP_MODULE" >> $GITHUB_OUTPUT

      - name: Create branch
        run: git checkout -b "scaffold/${{ steps.vars.outputs.app_name }}"

      - name: Copy template into apps/
        run: |
          cp -r templates/auditor-app "apps/${{ steps.vars.outputs.app_name }}"
          mv "apps/${{ steps.vars.outputs.app_name }}/__APP_MODULE__" "apps/${{ steps.vars.outputs.app_name }}/${{ steps.vars.outputs.app_module }}"

      - name: Substitute placeholders
        run: |
          APP_NAME="${{ steps.vars.outputs.app_name }}"
          APP_MODULE="${{ steps.vars.outputs.app_module }}"
          find "apps/$APP_NAME" -type f -exec sed -i "s/__APP_NAME__/$APP_NAME/g; s/__APP_MODULE__/$APP_MODULE/g" {} +

      - name: Generate release workflow
        run: |
          APP_NAME="${{ steps.vars.outputs.app_name }}"
          sed "s/__APP_NAME__/$APP_NAME/g" templates/release-workflow-template.yml > ".github/workflows/release-$APP_NAME.yml"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "apps/${{ steps.vars.outputs.app_name }}" ".github/workflows/release-${{ steps.vars.outputs.app_name }}.yml"
          git commit -m "Scaffold ${{ steps.vars.outputs.app_name }} from auditor-app template"
          git push -u origin "scaffold/${{ steps.vars.outputs.app_name }}"

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Scaffold ${{ steps.vars.outputs.app_name }}" \
            --body "Auto-generated by AWS Multiapp Create workflow from the auditor-app template." \
            --base main \
            --head "scaffold/${{ steps.vars.outputs.app_name }}"

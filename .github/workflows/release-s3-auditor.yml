name: Release s3-auditor

on:
  push:
    tags:
      - "s3-auditor-v*"

jobs:
  release:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/update-version.yml
    with:
      app-name: s3-auditor
      app-path: apps/s3-auditor
      version: ${{ github.ref_name }}

  deploy-dev:
    needs: release
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run audit (dev)
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }} \
            ghcr.io/bims-creator/s3-auditor:${{ github.ref_name }}

  deploy-pre:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: pre
    permissions:
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run audit (pre)
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }} \
            ghcr.io/bims-creator/s3-auditor:${{ github.ref_name }}

  deploy-prod:
    needs: deploy-pre
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run audit (prod)
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }} \
            ghcr.io/bims-creator/s3-auditor:${{ github.ref_name }}
